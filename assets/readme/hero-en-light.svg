<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="External Orchestrator — Model Router">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2f8ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="glow1" cx="84%" cy="22%" r="48%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="14%" cy="84%" r="42%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridPat" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#0284c7" stroke-width="0.8" stroke-opacity="0.07"/>
    </pattern>
    <clipPath id="outerClip">
      <rect x="2" y="2" width="1196" height="276" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#outerClip)">
    <rect x="2" y="2" width="1196" height="276" rx="22" fill="url(#bgGrad)"/>
    <rect x="2" y="2" width="1196" height="276" fill="url(#gridPat)"/>
    <rect x="2" y="2" width="1196" height="276" fill="url(#glow1)"/>
    <rect x="2" y="2" width="1196" height="276" fill="url(#glow2)"/>

    <!-- Top accent ribbon -->
    <rect x="2" y="2" width="1196" height="4" fill="url(#accentGrad)"/>

    <!-- Decorative right orbital rings -->
    <g opacity="0.18" transform="translate(1045, 140)">
      <circle cx="0" cy="0" r="118" fill="none" stroke="url(#accentGrad)" stroke-width="1.2" stroke-dasharray="6 8"/>
      <circle cx="0" cy="0" r="84" fill="none" stroke="#38bdf8" stroke-width="1"/>
      <circle cx="0" cy="0" r="50" fill="none" stroke="#6366f1" stroke-width="1" stroke-dasharray="3 5"/>
      <circle cx="-84" cy="0" r="4" fill="#38bdf8"/>
      <circle cx="59" cy="-59" r="3.5" fill="#6366f1"/>
    </g>

    <!-- Left glass icon badge -->
    <g transform="translate(46, 84)">
      <rect width="104" height="104" rx="24" fill="rgba(255,255,255,0.86)" stroke="url(#accentGrad)" stroke-width="1.8"/>
      <g transform="translate(4, 4)">
        
        <circle cx="48" cy="48" r="10" fill="url(#accentGrad)"/>
        <circle cx="22" cy="26" r="6" fill="none" stroke="url(#accentGrad)" stroke-width="2.6"/>
        <circle cx="74" cy="26" r="6" fill="none" stroke="url(#accentGrad)" stroke-width="2.6"/>
        <circle cx="22" cy="70" r="6" fill="none" stroke="url(#accentGrad)" stroke-width="2.6"/>
        <circle cx="74" cy="70" r="6" fill="none" stroke="url(#accentGrad)" stroke-width="2.6"/>
        <line x1="27" y1="30" x2="40" y2="41" stroke="url(#accentGrad)" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="69" y1="30" x2="56" y2="41" stroke="url(#accentGrad)" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="27" y1="66" x2="40" y2="55" stroke="url(#accentGrad)" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="69" y1="66" x2="56" y2="55" stroke="url(#accentGrad)" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="48" cy="48" r="28" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4 5" opacity="0.55"/>
      
      </g>
    </g>

    <!-- Eyebrow pill -->
    <g transform="translate(176, 48)">
      <rect width="388" height="26" rx="13" fill="rgba(241,245,249,0.92)" stroke="url(#accentGrad)" stroke-width="1" stroke-opacity="0.65"/>
      <text x="16" y="17.2" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">AZURE SUITE  ·  GOOGLE ANTIGRAVITY PLUGIN</text>
    </g>

    <!-- Main Title -->
    <text x="176" y="128" font-size="31" font-weight="800" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">External Orchestrator — Model Router</text>

    <!-- Secondary Title -->
    <text x="176" y="160" font-size="16.5" font-weight="600" fill="#64748b" letter-spacing="0.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">苍蓝协奏台——外部模型调度与省流</text>

    <!-- Subtitle -->
    <text x="176" y="196" font-size="15.5" font-weight="500" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">Multi-provider external worker routing, custom profiles, circuit breaker &amp; live telemetry</text>

    <!-- Feature pills -->
    
        <g transform="translate(176, 216)">
          <rect width="167" height="30" rx="15" fill="rgba(241,245,249,0.92)" stroke="rgba(148,163,184,0.38)" stroke-width="1"/>
          <circle cx="14" cy="15" r="3.5" fill="url(#accentGrad)"/>
          <text x="25" y="19.5" font-size="13" font-weight="600" fill="#1e293b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">Zero Dependencies</text>
        </g>
        <g transform="translate(355, 216)">
          <rect width="151" height="30" rx="15" fill="rgba(241,245,249,0.92)" stroke="rgba(148,163,184,0.38)" stroke-width="1"/>
          <circle cx="14" cy="15" r="3.5" fill="url(#accentGrad)"/>
          <text x="25" y="19.5" font-size="13" font-weight="600" fill="#1e293b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">Custom Profiles</text>
        </g>
        <g transform="translate(518, 216)">
          <rect width="135" height="30" rx="15" fill="rgba(241,245,249,0.92)" stroke="rgba(148,163,184,0.38)" stroke-width="1"/>
          <circle cx="14" cy="15" r="3.5" fill="url(#accentGrad)"/>
          <text x="25" y="19.5" font-size="13" font-weight="600" fill="#1e293b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">Neko Glass UI</text>
        </g>
  </g>

  <rect x="2" y="2" width="1196" height="276" rx="22" fill="none" stroke="rgba(56,189,248,0.28)" stroke-width="1.5"/>
</svg>
